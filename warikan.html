<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>イベント別おこづかい帳</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;background:#f4f3ef;color:#1a1a18;font-size:15px;min-height:100vh;}
button,input,select{font-family:inherit;cursor:pointer;}
.hdr{background:#1a1a18;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:10;}
.hdr-title{flex:1;font-size:16px;font-weight:500;}
.back-btn{background:none;border:none;color:#fff;font-size:24px;padding:0 4px;line-height:1;}
.body{padding:12px;max-width:440px;margin:0 auto;}
.card{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.big-btn{width:100%;padding:14px;border-radius:12px;border:none;background:#1a1a18;color:#fff;font-size:15px;font-weight:500;margin-bottom:10px;display:block;}
.out-btn{width:100%;padding:13px;border-radius:12px;border:0.5px solid rgba(0,0,0,0.2);background:none;color:#1a1a18;font-size:14px;margin-bottom:10px;display:block;}
.inp{width:100%;padding:12px 13px;border:0.5px solid rgba(0,0,0,0.25);border-radius:8px;font-size:16px;background:#fff;color:#1a1a18;-webkit-appearance:none;}
.sel{width:100%;padding:12px 13px;border:0.5px solid rgba(0,0,0,0.25);border-radius:8px;font-size:16px;background:#fff;color:#1a1a18;appearance:none;}
.lb{font-size:12px;font-weight:500;color:#666;display:block;margin-bottom:5px;}
.fg{margin-bottom:14px;}
.chip{display:inline-flex;padding:8px 13px;border-radius:20px;border:0.5px solid rgba(0,0,0,0.15);background:none;color:#666;font-size:14px;margin:3px;}
.chip.on{background:#1a1a18;color:#fff;border-color:#1a1a18;}
.tag{display:inline-flex;align-items:center;gap:6px;background:#f4f3ef;border-radius:20px;padding:7px 12px;font-size:13px;margin:3px;border:0.5px solid rgba(0,0,0,0.1);}
.tag-x{cursor:pointer;color:#888;font-weight:500;font-size:16px;line-height:1;}
.badge{display:inline-block;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:500;}
.badge.open{background:#e8f0fe;color:#1a56db;border:0.5px solid #b3c8f8;}
.badge.settled{background:#f4f3ef;color:#888;border:0.5px solid rgba(0,0,0,0.1);}
.divider{height:0.5px;background:rgba(0,0,0,0.1);margin:10px 0;}
.muted{font-size:12px;color:#888;}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat-cell{background:#f4f3ef;border-radius:8px;padding:8px 10px;}
.toast{background:#1a1a18;color:#fff;padding:10px 20px;text-align:center;font-size:13px;font-weight:500;}
.empty{text-align:center;color:#888;padding:32px 0;font-size:14px;}
.settle-box{background:#f0faf4;border:0.5px solid #6dbf8e;border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.tx-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;}
.d-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;}
.d-meta{display:flex;gap:8px;font-size:12px;color:#888;}
.inc-amt{color:#1a7a45;font-size:16px;font-weight:500;}
.exp-amt{color:#c0392b;font-size:16px;font-weight:500;}
.tbadge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:500;margin-right:4px;}
.tbadge.in{background:#e8f5ee;color:#1a7a45;border:0.5px solid #a3d9b8;}
.tbadge.ex{background:#fef0f0;color:#c0392b;border:0.5px solid #f5bfbf;}
.slbl{font-size:12px;font-weight:500;color:#888;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.slbl2{font-size:12px;font-weight:500;color:#888;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 8px;}
.sec-hd{font-size:14px;font-weight:500;margin-bottom:10px;}
.dk-btn{padding:11px 16px;border-radius:8px;border:none;background:#1a1a18;color:#fff;font-size:15px;}
.unit-inp{width:64px;padding:5px 8px;border:0.5px solid rgba(0,0,0,0.2);border-radius:6px;font-size:13px;background:#fff;color:#1a1a18;text-align:center;}
.r8{display:flex;gap:8px;}
.fw{display:flex;flex-wrap:wrap;}
.fw-mb{display:flex;flex-wrap:wrap;margin-bottom:10px;}
.fi{flex:1;min-width:0;}
.f1{flex:1;}
.sw-track{position:relative;height:56px;background:#f4f3ef;border-radius:28px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;}
.sw-fill{position:absolute;left:0;top:0;height:100%;width:0%;background:#f5bfbf;border-radius:28px;transition:background .2s;}
.sw-thumb{position:absolute;left:4px;top:4px;width:48px;height:48px;background:#c0392b;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:grab;}
.sw-lbl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;color:#aaa;pointer-events:none;white-space:nowrap;}
</style>
</head>
<body>
<div id="T"></div>
<div id="M"></div>
<script>
const SK={ev:'wk5_ev',ex:'wk5_ex',ms:'wk5_ms'};
const DM={members:['TOSHI','MIDORI'],cats:['飲食費','交通費','ガソリン代','ETC代','レンタカー代','宿泊費','娯楽費','日用品費','お土産代','その他'],pays:[{nm:'ANA Pay',sp:true,unit:'マイル'},{nm:'JCB-SFC',sp:true,unit:'円'},{nm:'VISA-EPOS',sp:true,unit:'円'},{nm:'PayPay',sp:true,unit:'円'},{nm:'電子マネー',sp:true,unit:'円'},{nm:'交通系IC',sp:false,unit:'円'},{nm:'現金',sp:false,unit:'円'}],incats:['餞別','ポイ活','前払金','精算金端数','その他収入']};
let EV=[],EX=[],MS={...DM,members:[...DM.members],cats:[...DM.cats],pays:DM.pays.map(p=>({...p})),incats:[...DM.incats]};
let PAGE='list',EVID=null,CU=null,LS={all:true,sel:null},SY=0;
let FEV={nm:'',dtMode:'range',dtFrom:'',dtTo:'',mb:[],localMb:[]};
let FEX={py:'',sAll:true,sSel:[],amt:'',cat:'',pay:'',dt:'',memo:''};
let FIN={py:'',sAll:true,sSel:[],amt:'',cat:'',dt:'',memo:''};
let _swMM=null,_swMU=null,EDIT_ID=null;
const newId=()=>Date.now()+'_'+Math.random().toString(36).slice(2,7);

const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const today=()=>new Date().toISOString().slice(0,10);
const fD=d=>{if(!d)return'';const p=d.split('-');return`${+p[1]}/${+p[2]}`;};
const fmtAmt=(n,unit)=>unit&&unit!=='円'?Math.round(n).toLocaleString('ja-JP')+unit:fmt(n);
const normPays=arr=>(arr||[]).map(p=>typeof p==='string'?{nm:p,sp:true,unit:'円'}:{nm:p.nm,sp:!!p.sp,unit:p.unit||'円'});
function fmtEvDt(ev){
  if(ev.dtMode==='range'&&ev.dtFrom&&ev.dtTo){
    const f=ev.dtFrom.split('-'),t=ev.dtTo.split('-');
    if(ev.dtFrom===ev.dtTo) return`${f[0]}/${+f[1]}/${+f[2]}`;
    if(f[0]===t[0]&&f[1]===t[1]) return`${f[0]}/${+f[1]}/${+f[2]}〜${+t[2]}`;
    if(f[0]===t[0]) return`${f[0]}/${+f[1]}/${+f[2]}〜${+t[1]}/${+t[2]}`;
    return`${f[0]}/${+f[1]}/${+f[2]}〜${t[0]}/${+t[1]}/${+t[2]}`;
  }
  const d=(ev.dt||ev.dtFrom||'');
  if(!d)return'';
  const p=d.split('-');
  return`${p[0]}/${+p[1]}/${+p[2]}`;
}
const GAS_URL='https://script.google.com/macros/s/AKfycbzzKkyxd9ovOhhZZ4ShmXIaS0ERDmc_KvsM8WFu-xCb5CIdi9C_fHzyJndqDAtq0OEqvA/exec';

async function gasRead(){
  try{
    const res=await fetch(GAS_URL+'?action=read');
    const json=await res.json();
    return json.ok?json.data:{};
  }catch(_){return {};}
}
async function gasWrite(payload){
  try{
    const res=await fetch(GAS_URL+'?action=write&payload='+encodeURIComponent(JSON.stringify(payload)));
    const json=await res.json();
    if(!json.ok)toast('保存に失敗しました');
  }catch(_){toast('保存に失敗しました');}
}

async function load(){
  document.getElementById('M').innerHTML='<div style="text-align:center;padding:60px 0;color:#888;font-size:14px;">読み込み中...</div>';
  const d=await gasRead();
  try{if(d[SK.ev])EV=JSON.parse(d[SK.ev]);}catch(_){}
  try{if(d[SK.ex])EX=JSON.parse(d[SK.ex]);}catch(_){}
  try{if(d[SK.ms]){const m=JSON.parse(d[SK.ms]);MS={...DM,...m,members:m.members||[...DM.members],cats:m.cats||[...DM.cats],pays:normPays(m.pays||DM.pays),incats:m.incats||[...DM.incats]};}}catch(_){}
  try{const cu=localStorage.getItem('wk5_cu');if(cu)CU=cu;}catch(_){}
  render();
}
async function sEv(v){EV=v;await gasWrite({[SK.ev]:JSON.stringify(v)});}
async function sEx(v){EX=v;await gasWrite({[SK.ex]:JSON.stringify(v)});}
async function sMs(v){MS=v;await gasWrite({[SK.ms]:JSON.stringify(v)});}
function toast(m){clearTimeout(window._TT);document.getElementById('T').innerHTML=`<div class="toast">${esc(m)}</div>`;window._TT=setTimeout(()=>document.getElementById('T').innerHTML='',2000);}
function cleanupSwipe(){if(_swMM)document.removeEventListener('mousemove',_swMM);if(_swMU)document.removeEventListener('mouseup',_swMU);_swMM=_swMU=null;}
function go(p,id=null){
  cleanupSwipe();
  if(PAGE==='detail')SY=document.documentElement.scrollTop||0;
  if(id!==null&&id!==EVID){EVID=id;LS={all:true,sel:null};}
  if(p!=='new_ex'&&p!=='new_in')EDIT_ID=null;
  PAGE=p;render();
  p==='detail'?setTimeout(()=>{document.documentElement.scrollTop=SY;},0):document.documentElement.scrollTop=0;
}
function calcBalance(mb,recs){
  const bal={};mb.forEach(m=>bal[m]=0);
  recs.forEach(r=>{
    const sp=r.sw==='all'?mb:(r.sw||mb),v=sp.filter(m=>mb.includes(m));
    if(!v.length||!mb.includes(r.py))return;
    const s=r.tp==='in'?-1:1;bal[r.py]+=s*r.amt;v.forEach(m=>bal[m]-=s*r.amt/v.length);
  });
  return mb.map(m=>({n:m,bl:bal[m]}));
}
function calcSettle(mb,recs){
  const mt=calcBalance(mb,recs);
  const pos=[],neg=[];
  mt.forEach(({n,bl})=>{if(bl>0.5)pos.push({n,a:bl});else if(bl<-0.5)neg.push({n,a:-bl});});
  pos.sort((a,b)=>b.a-a.a);neg.sort((a,b)=>b.a-a.a);
  const tx=[];let p=0,n=0;
  while(p<pos.length&&n<neg.length){
    const a=Math.min(pos[p].a,neg[n].a);tx.push({fr:neg[n].n,to:pos[p].n,am:Math.round(a)});
    pos[p].a-=a;neg[n].a-=a;if(pos[p].a<0.5)p++;if(neg[n].a<0.5)n++;
  }
  return{tx,mt};
}
const hdr=(title,back,right='')=>`<div class="hdr">${back?`<button class="back-btn" onclick="${back}">‹</button>`:''}<div class="hdr-title">${esc(title)}</div>${right}</div>`;
const bdg=st=>`<span class="badge ${st}">${st==='open'?'進行中':'精算済'}</span>`;
const chipsH=(items,sel,fn)=>items.map(m=>`<button class="chip${sel.includes(m)?' on':''}" onclick="${fn}(${esc(JSON.stringify(m))})">${esc(m)}</button>`).join('');
const fgH=(label,html)=>`<div class="fg"><label class="lb">${label}</label>${html}</div>`;
const selH=(id,opts,val,onch='')=>`<select class="sel" id="${id}" onchange="${onch}">${opts.map(o=>{const v=typeof o==='string'?o:o.v,t=typeof o==='string'?o:o.t;return`<option value="${esc(v)}"${val===v?' selected':''}>${esc(t)}</option>`;}).join('')}</select>`;
const selEv=()=>EV.find(e=>e.id===EVID);

function initFEV(){FEV={nm:'',dtMode:'range',dtFrom:today(),dtTo:today(),mb:[],localMb:[...MS.members]};}
function fevToggleM(name){const i=FEV.mb.indexOf(name);if(i>=0)FEV.mb.splice(i,1);else FEV.mb.push(name);const el=document.getElementById('fev-chips');if(el)el.innerHTML=chipsH(FEV.localMb,FEV.mb,'fevToggleM');}
function fevAddM(){const inp=document.getElementById('fev-new-m'),v=inp.value.trim();if(!v)return;if(FEV.localMb.includes(v)){toast('すでにいます');return;}FEV.localMb.push(v);FEV.mb.push(v);inp.value='';const el=document.getElementById('fev-chips');if(el)el.innerHTML=chipsH(FEV.localMb,FEV.mb,'fevToggleM');}
function fevToggleDt(mode){FEV.dtMode=mode;document.getElementById('fev-dt-single').style.display=mode==='single'?'block':'none';document.getElementById('fev-dt-range').style.display=mode==='range'?'grid':'none';document.querySelectorAll('.fev-dt-btn').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));}
async function fevSave(){
  const nm=document.getElementById('fev-nm').value.trim();if(!nm){toast('イベント名を入力してください');return;}
  let dtData=FEV.dtMode==='single'?{dt:document.getElementById('fev-dt').value,dtMode:'single'}:(()=>{const f=document.getElementById('fev-from').value,t=document.getElementById('fev-to').value;if(f>t){toast('終了日は開始日以降にしてください');return null;}return{dt:f,dtMode:'range',dtFrom:f,dtTo:t};})();
  if(!dtData)return;
  if(FEV.mb.length===0){toast('参加者を1人以上追加してください');return;}
  const nev={id:newId(),ca:Date.now(),st:'open',nm,...dtData,mb:FEV.mb};
  await sEv([nev,...EV]);toast('作成しました');go('detail',nev.id);
}

function initSplitForm(ev){const def=(CU&&ev.mb.includes(CU))?CU:(ev.mb[0]||'');return{py:def,sAll:true,sSel:[...ev.mb],amt:'',cat:'',dt:today(),memo:''};}
function initFEX(ev){const ss=LS.sel?LS.sel.filter(m=>ev.mb.includes(m)):[...ev.mb];FEX={...initSplitForm(ev),sAll:LS.all,sSel:ss.length?ss:[...ev.mb],pay:''};}
function initFIN(ev){FIN=initSplitForm(ev);}

function fexSelPayer(name){FEX.py=name;const el=document.getElementById('fex-payer');if(el)el.innerHTML=chipsH(selEv().mb,[FEX.py],'fexSelPayer');}
function fexToggleSAll(all){FEX.sAll=all;reFexSplit();}
function fexToggleSM(name){const i=FEX.sSel.indexOf(name);if(i>=0)FEX.sSel.splice(i,1);else FEX.sSel.push(name);reFexSplit();}

function finSelPayer(name){FIN.py=name;const el=document.getElementById('fin-payer');if(el)el.innerHTML=chipsH(selEv().mb,[FIN.py],'finSelPayer');}
function finToggleSAll(all){FIN.sAll=all;reFinSplit();}
function finToggleSM(name){const i=FIN.sSel.indexOf(name);if(i>=0)FIN.sSel.splice(i,1);else FIN.sSel.push(name);reFinSplit();}

function renderSplit(btnId,chipId,form,ev,allFn,memFn){
  const b=document.getElementById(btnId),c=document.getElementById(chipId);
  if(b)b.innerHTML=`<button class="chip${form.sAll?' on':''}" onclick="${allFn}(true)">全員(${ev.mb.length}人)</button><button class="chip${form.sAll?'':' on'}" onclick="${allFn}(false)">選択する</button>`;
  if(c)c.innerHTML=form.sAll?'':chipsH(ev.mb,form.sSel,memFn);
}
function reFexSplit(){const ev=selEv();if(ev)renderSplit('fex-split-btns','fex-split-chips',FEX,ev,'fexToggleSAll','fexToggleSM');}
function reFinSplit(){const ev=selEv();if(ev)renderSplit('fin-split-btns','fin-split-chips',FIN,ev,'finToggleSAll','finToggleSM');}

function fexUpdatePayNote(){const v=document.getElementById('fex-pay')?.value,p=normPays(MS.pays||[]).find(x=>x.nm===v),el=document.getElementById('fex-pay-note');if(el){el.textContent=p?(p.sp?'○ 対象者':'× 対象者外'):'';el.style.color=p?.sp?'#1a7a45':'#888';}}
async function fexSave(){
  const amt=parseFloat(document.getElementById('fex-amt').value);
  if(!amt||isNaN(amt)||amt<=0){toast('金額を正しく入力してください');return;}
  if(!FEX.py){toast('支払者を選択してください');return;}
  if(!FEX.sAll&&!FEX.sSel.length){toast('対象者を選択してください');return;}
  LS={all:FEX.sAll,sel:FEX.sAll?null:[...FEX.sSel]};
  const base={eid:EVID,tp:'ex',dt:document.getElementById('fex-dt').value,py:FEX.py,amt,cat:document.getElementById('fex-cat').value||'その他',pay:document.getElementById('fex-pay').value,memo:document.getElementById('fex-memo').value,sw:FEX.sAll?'all':FEX.sSel};
  if(EDIT_ID){await sEx(EX.map(e=>e.id===EDIT_ID?{...e,...base}:e));toast('更新しました');}
  else{await sEx([{id:newId(),ca:Date.now(),...base},...EX]);toast('追加しました');}
  EDIT_ID=null;go('detail');
}
async function finSave(){
  const amt=parseFloat(document.getElementById('fin-amt').value);
  if(!amt||isNaN(amt)||amt<=0){toast('金額を正しく入力してください');return;}
  if(!FIN.sAll&&!FIN.sSel.length){toast('分配対象を選択してください');return;}
  const base={eid:EVID,tp:'in',dt:document.getElementById('fin-dt').value,py:FIN.py,amt,cat:document.getElementById('fin-cat').value||'その他収入',memo:document.getElementById('fin-memo').value,sw:FIN.sAll?'all':FIN.sSel};
  if(EDIT_ID){await sEx(EX.map(e=>e.id===EDIT_ID?{...e,...base}:e));toast('更新しました');}
  else{await sEx([{id:newId(),ca:Date.now(),...base},...EX]);toast('追加しました');}
  EDIT_ID=null;go('detail');
}

function msMoveTag(key,val,dir){
  const arr=MS[key]||[];
  const i=arr.findIndex(x=>(x.nm||x)===val);
  if(i<0)return;
  const ni=i+dir;
  if(ni<0||ni>=arr.length)return;
  const a=[...arr];[a[i],a[ni]]=[a[ni],a[i]];
  MS[key]=a;sMs({...MS});
  if(key==='pays')reRenderMsPays();else{const el=document.getElementById(`ms-tags-${key}`);if(el)el.innerHTML=msTags(MS[key],key);}
}
const udBtn=(key,val,dir)=>`<button style="background:none;border:0.5px solid rgba(0,0,0,0.15);border-radius:6px;color:#888;font-size:12px;padding:3px 7px;line-height:1;" onclick="msMoveTag('${key}',${esc(JSON.stringify(val))},${dir})">${dir<0?'↑':'↓'}</button>`;

const msTags=(arr,key)=>{
  const items=arr||[];
  if(!items.length)return key==='members'?'<div class="muted" style="padding:4px 0">まだいません</div>':'';
  return items.map((it,i)=>{
    const v=typeof it==='string'?it:it.nm;
    return `<div style="display:flex;align-items:center;padding:9px 0;border-bottom:${i<items.length-1?'0.5px solid rgba(0,0,0,0.07)':'none'};">
      <div style="flex:1;font-size:14px;">${esc(v)}</div>
      <div style="display:flex;gap:4px;flex-shrink:0;">
        <button style="background:none;border:0.5px solid rgba(0,0,0,0.15);border-radius:6px;color:#888;font-size:13px;padding:4px 9px;width:34px;" onclick="msMoveTag('${key}',${esc(JSON.stringify(v))},-1)">${i>0?'↑':''}</button>
        <button style="background:none;border:0.5px solid rgba(0,0,0,0.15);border-radius:6px;color:#888;font-size:13px;padding:4px 9px;width:34px;" onclick="msMoveTag('${key}',${esc(JSON.stringify(v))},1)">${i<items.length-1?'↓':''}</button>
        <button style="background:none;border:0.5px solid rgba(0,0,0,0.15);border-radius:6px;color:#aaa;font-size:14px;padding:4px 9px;" onclick="msDelTag('${key}',${esc(JSON.stringify(v))})">×</button>
      </div>
    </div>`;
  }).join('');
};
function msAddTag(key,inputId){
  const inp=document.getElementById(inputId),v=inp.value.trim();if(!v)return;
  if(key==='pays'?normPays(MS.pays).find(x=>x.nm===v):(MS[key]||[]).includes(v)){toast('すでにあります');return;}
  MS[key]=key==='pays'?[...(MS.pays||[]),{nm:v,sp:true,unit:'円'}]:[...(MS[key]||[]),v];
  sMs({...MS});inp.value='';
  if(key==='pays')reRenderMsPays();else{const el=document.getElementById(`ms-tags-${key}`);if(el)el.innerHTML=msTags(MS[key],key);}
  toast('追加しました');
}
function msDelTag(key,val){
  MS[key]=(MS[key]||[]).filter(x=>(x.nm||x)!==val);sMs({...MS});
  if(key==='pays')reRenderMsPays();else{const el=document.getElementById(`ms-tags-${key}`);if(el)el.innerHTML=msTags(MS[key],key);}
}

function setupSwipe(){
  cleanupSwipe();
  const track=document.getElementById('sw-track');if(!track)return;
  const fill=document.getElementById('sw-fill'),thumb=document.getElementById('sw-thumb'),lbl=document.getElementById('sw-lbl');
  let drag=false,startX=0,curX=0,maxX=0,done=false;
  const update=x=>{if(done)return;curX=Math.max(0,Math.min(x,maxX));const pct=curX/maxX;thumb.style.left=(4+curX)+'px';fill.style.width=(curX+28)+'px';fill.style.background=`rgba(192,57,43,${0.15+pct*0.35})`;lbl.style.opacity=Math.max(0,1-pct*2);
    if(pct>=1){done=true;thumb.style.background='#1a7a45';thumb.querySelector('span').textContent='✓';fill.style.background='rgba(26,122,69,0.25)';setTimeout(async()=>{await sEv(EV.filter(e=>e.id!==EVID));await sEx(EX.filter(e=>e.eid!==EVID));toast('削除しました');go('list');},300);}};
  const reset=()=>{if(done)return;curX=0;thumb.style.cssText+='transition:left .3s';fill.style.cssText+='transition:width .3s';thumb.style.left='4px';fill.style.width='0';fill.style.background='#f5bfbf';lbl.style.opacity='1';setTimeout(()=>{thumb.style.transition='';fill.style.transition='';},300);};
  track.addEventListener('mousedown',e=>{drag=true;maxX=track.offsetWidth-56;startX=e.clientX-curX;e.preventDefault();});
  _swMM=e=>{if(drag)update(e.clientX-startX);};
  _swMU=()=>{if(drag){drag=false;if(!done)reset();}};
  document.addEventListener('mousemove',_swMM);
  document.addEventListener('mouseup',_swMU);
  track.addEventListener('touchstart',e=>{drag=true;maxX=track.offsetWidth-56;startX=e.touches[0].clientX-curX;e.preventDefault();},{passive:false});
  track.addEventListener('touchmove',e=>{if(drag)update(e.touches[0].clientX-startX);e.preventDefault();},{passive:false});
  track.addEventListener('touchend',()=>{if(drag){drag=false;if(!done)reset();}});
}

  }
  const mbRows=mt.map((m,i)=>`<div class="d-row" style="${i<mt.length-1?'border-bottom:0.5px solid rgba(0,0,0,0.08);':''}"><div style="font-weight:500;">${esc(m.n)}</div>
    <div class="d-meta">${Math.abs(m.bl)>0.5?`<span style="color:#888;">${m.bl>0?'受取':'支払'}</span>`:''}<span style="font-weight:500;color:${m.bl>0?'#1a7a45':m.bl<0?'#c0392b':'#888'};">${m.bl>0?'+':''}${fmt(m.bl)}</span></div></div>`).join('');
  return hdr('収支の確認',"go('detail')")
    +`<div class="body"><div class="settle-box"><div class="grid3">${sbCells}</div><div style="font-size:12px;color:#1a7a45;margin-top:8px;">${ev.mb.length}人・${recs.length}件</div></div>`
    +'<div class="slbl">精算内容</div>'+txRows+nsH
    +'<div class="slbl2">参加者別明細</div><div class="card">'+mbRows+'</div>'
    +(ev.st==='open'?'<button class="big-btn" style="margin-top:8px;" onclick="settleClose()">精算完了にする</button>':'<button class="out-btn" style="margin-top:8px;" onclick="settleReopen()">イベントを再開する</button>')
    +'</div>';
}
async function settleClose(){await sEv(EV.map(e=>e.id===EVID?{...e,st:'settled'}:e));toast('精算完了にしました');go('detail');}
async function settleReopen(){await sEv(EV.map(e=>e.id===EVID?{...e,st:'open'}:e));toast('再開しました');go('detail');}

function pageDeleteEv(){
  const ev=selEv();if(!ev)return'';const cnt=EX.filter(e=>e.eid===EVID).length;
  return hdr('イベントの削除',"go('detail')")
    +`<div class="body"><div style="background:#fff8f8;border:0.5px solid #f5bfbf;border-radius:12px;padding:16px;margin-bottom:14px;">
    <div style="font-size:15px;font-weight:500;color:#c0392b;margin-bottom:8px;">イベントを削除します</div>
    <div style="font-size:13px;color:#888;line-height:1.7;">「${esc(ev.nm)}」および明細 ${cnt} 件がすべて削除されます。この操作は取り消せません。</div></div>
    <div class="card"><div style="font-size:13px;color:#888;margin-bottom:16px;line-height:1.7;">下のスライダーを右端まで長押ししながらスワイプしてください。</div>
    <div class="sw-track" id="sw-track"><div class="sw-fill" id="sw-fill"></div><div class="sw-lbl" id="sw-lbl">スワイプして削除</div>
    <div class="sw-thumb" id="sw-thumb"><span style="color:#fff;font-size:20px;line-height:1;">›</span></div></div></div>
    <button class="out-btn" onclick="go('detail')">キャンセル</button></div>`;
}

function render(){
  const p={list:pageList,master:pageMaster,new_ev:pageNewEv,new_ex:pageNewEx,new_in:pageNewIn,detail:pageDetail,settle:pageSettle,delete_ev:pageDeleteEv};
  document.getElementById('M').innerHTML=p[PAGE]?.()||'';
  if(PAGE==='delete_ev')setupSwipe();
  if(PAGE==='new_ev'){const t=today();['fev-dt','fev-from','fev-to'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=t;});}
  if(PAGE==='new_ex'){
    const dt=document.getElementById('fex-dt');
    if(dt)dt.value=EDIT_ID&&FEX.dt?FEX.dt:today();
    if(EDIT_ID){
      const amt=document.getElementById('fex-amt');if(amt)amt.value=FEX.amt||'';
      const cat=document.getElementById('fex-cat');if(cat)cat.value=FEX.cat||'';
      const pay=document.getElementById('fex-pay');if(pay){pay.value=FEX.pay||'';fexUpdatePayNote();}
      const memo=document.getElementById('fex-memo');if(memo)memo.value=FEX.memo||'';
    }
  }
  if(PAGE==='new_in'){
    const dt=document.getElementById('fin-dt');
    if(dt)dt.value=EDIT_ID&&FIN.dt?FIN.dt:today();
    if(EDIT_ID){
      const amt=document.getElementById('fin-amt');if(amt)amt.value=FIN.amt||'';
      const cat=document.getElementById('fin-cat');if(cat)cat.value=FIN.cat||'';
      const memo=document.getElementById('fin-memo');if(memo)memo.value=FIN.memo||'';
    }
  }
}
load();
</script>
</body>
</html>
